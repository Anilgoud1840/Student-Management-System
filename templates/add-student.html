
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Student</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0e7ff, #fce7f3, #dbeafe);
            color: #1e293b;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(110deg, #4338ca, #7c3aed, #db2777);
            padding: 25px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: white;
            font-size: 27px;
        }

        .home-btn {
            background: white;
            color: #4338ca;
            padding: 11px 20px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .main {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .form-card {
            background: linear-gradient(145deg, #ffffff, #eef2ff);
            padding: 35px;
            border-radius: 18px;
            border: 1px solid #c7d2fe;
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.15);
        }

        .form-title {
            text-align: center;
            color: #4338ca;
            font-size: 25px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #334155;
        }

        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        input:focus, select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn {
            background: linear-gradient(110deg, #4338ca, #7c3aed);
            color: white;
        }

        .reset-btn {
            background: #e2e8f0;
            color: #334155;
        }

        @media (max-width: 600px) {
            .header {
                padding: 20px;
                gap: 12px;
            }

            .header h1 {
                font-size: 20px;
            }

            .form-card {
                padding: 22px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <h1>Student Management</h1>

        <a href="/" class="home-btn">
            Back to Home
        </a>
    </header>

    <main class="main">

        <div class="form-card">

            <h2 class="form-title">Add New Student</h2>

            <p class="subtitle">
                Enter the student details below.
            </p>

            <form action="/students/add" method="post">

                <div class="form-group">
                    <label for="name">Student Name</label>
                    <input type="text"
                           id="name"
                           name="name"
                           placeholder="Enter student name"
                           required>
                </div>

                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number"
                           id="age"
                           name="age"
                           min="18"
                           max="60"
                           placeholder="Enter age"
                           required>
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>

                    <select id="gender" name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="marks">Marks</label>
                    <input type="number"
                           id="marks"
                           name="marks"
                           min="0"
                           max="100"
                           placeholder="Enter marks"
                           required>
                </div>

                <div class="form-group">
                    <label for="course">Course</label>
                    <input type="text"
                           id="course"
                           name="course"
                           placeholder="Enter course name"
                           required>
                </div>

                <div class="form-group">
                    <label for="image">Student Image URL</label>
                    <input type="url"
                           id="image"
                           name="image"
                           placeholder="Paste image URL (optional)">
                </div>

                <div class="form-group">
                    <label for="status">Attendance Status</label>

                    <select id="status" name="status" required>
                        <option value="">Select Status</option>
                        <option value="1">Present</option>
                        <option value="0">Absent</option>
                    </select>
                </div>

                <div class="buttons">

                    <button type="submit" class="submit-btn">
                        Add Student
                    </button>

                    <button type="reset" class="reset-btn">
                        Clear Form
                    </button>

                </div>

            </form>

        </div>

    </main>

</body>
</html>
